name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The built site is committed to docs/, so this job only packages it.
  # Upload runs in its own job so the deploy job starts after GitHub has
  # registered the artifact; running both in one job raced and deploy-pages
  # could report "No artifacts named github-pages were found".
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
